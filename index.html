<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lithuania Memory Jump</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#112236;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;z-index:5}
.p{background:rgba(255,255,255,.86);padding:8px 12px;border-radius:999px;color:#17324d;box-shadow:0 4px 18px #0002}
#stage{position:fixed;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);background:#17324de8;color:white;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;z-index:5}
#controls{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:34px;z-index:7}
.ctrl{width:92px;height:62px;border:1px solid #ffffff55;border-radius:22px;background:rgba(23,50,77,.88);backdrop-filter:blur(8px);color:white;font-size:31px;font-weight:900;box-shadow:0 8px 24px #0004;-webkit-user-select:none;user-select:none}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#14263a55,#14263a99);z-index:10}
#card{width:min(90vw,440px);padding:27px;background:rgba(255,255,255,.93);border-radius:27px;text-align:center;box-shadow:0 20px 60px #0005;color:#17324d}
h1{margin:0 0 10px;font-size:42px;line-height:.98}
p{line-height:1.6;color:#294b69}
#start,#retry{border:0;border-radius:999px;background:#17324d;color:white;font-size:17px;font-weight:900;padding:14px 24px}
.note{font-size:12px;opacity:.68;margin-top:12px}
#credit{position:fixed;right:8px;bottom:max(92px,calc(env(safe-area-inset-bottom) + 84px));z-index:6;font-size:9px;color:#fff;background:#0008;padding:4px 7px;border-radius:7px;max-width:70vw;text-align:right;pointer-events:none}
#flash{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%) scale(.9);z-index:8;background:#17324deb;color:white;padding:10px 16px;border-radius:999px;font-weight:800;opacity:0;transition:.18s;white-space:nowrap;pointer-events:none}
#flash.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="p">🇱🇹 <span id="score">0 m</span></div><div class="p">🧡 <span id="items">0</span></div></div>
<div id="stage">🏛️ Vilnius</div>
<div id="credit"></div>
<div id="flash"></div>
<div id="controls">
  <button class="ctrl" id="left">←</button>
  <button class="ctrl" id="right">→</button>
</div>
<div id="overlay">
  <div id="card">
    <h1>Lithuania<br>Memory Jump</h1>
    <p>写真で旅を振り返りながら空へ。<br><b>← → を押しっぱなし</b>で移動し、足場に着くと自動ジャンプします。</p>
    <button id="start">旅をはじめる</button>
    <div class="note">Vilnius → Trakai → Šiauliai → Helsinki</div>
  </div>
</div>
<script>
(function(){
"use strict";
var canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
var scoreEl=document.getElementById("score"),itemsEl=document.getElementById("items");
var overlay=document.getElementById("overlay"),stageEl=document.getElementById("stage"),creditEl=document.getElementById("credit"),flash=document.getElementById("flash");
var W=0,H=0,DPR=1,running=false,last=0,camera=0,score=0,count=0,move=0,currentStage=-1;
var player,plats=[],gems=[];

var stages=[
 {m:0,n:"🏛️ Vilnius Old Town",
  src:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Wilno_-_panorama_z_wie%C5%BCy_Giedymina.jpg?width=1280",
  credit:"Vilnius panorama — Sfu / Wikimedia Commons / CC BY-SA"},
 {m:350,n:"🏰 Trakai Castle",
  src:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Trakai_Island_Castle.jpg?width=1280",
  credit:"Trakai Island Castle — Dmitry A. Mottl / Wikimedia Commons / CC BY-SA 3.0"},
 {m:800,n:"🌿 Šiauliai • Hill of Crosses",
  src:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Hill_of_Crosses_-_Lithuania.jpg?width=1280",
  credit:"Hill of Crosses — Ben Meyer / Wikimedia Commons / CC BY-SA 4.0"},
 {m:1350,n:"❤️ Lithuania Memories",
  src:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Trakai_castle_view.jpg?width=1280",
  credit:"Trakai castle view — Wikimedia Commons"},
 {m:1900,n:"✈️ Helsinki & Home",
  src:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Helsinki_Cathedral_view.jpg?width=1280",
  credit:"Helsinki Cathedral view — John Samuel / Wikimedia Commons / CC BY-SA"}
];
stages.forEach(function(s){var im=new Image();im.referrerPolicy="no-referrer";im.src=s.src;s.img=im;});

function resize(){
 DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();
function rnd(a,b){return a+Math.random()*(b-a)}
function sy(y){return y-camera}
function stIndex(){var n=0;for(var i=0;i<stages.length;i++)if(score>=stages[i].m)n=i;return n}

function addPlatform(y){
 var w=rnd(118,178),x=rnd(12,Math.max(13,W-w-12));
 plats.push({x:x,y:y,w:w});
 if(Math.random()<.48)gems.push({x:x+w/2,y:y-23,taken:false,kind:Math.random()<.7?"amber":"heart"});
}
function reset(){
 running=true;camera=0;score=0;count=0;move=0;currentStage=-1;plats=[];gems=[];
 player={x:W/2,y:H*.68,vx:0,vy:-420,w:32,h:40};
 var y=H*.80;plats.push({x:W/2-92,y:y,w:184});
 for(var i=1;i<24;i++){y-=72;addPlatform(y)}
 scoreEl.textContent="0 m";itemsEl.textContent="0";overlay.style.display="none";last=performance.now();requestAnimationFrame(loop);
}
function bind(id,v){
 var b=document.getElementById(id);
 b.addEventListener("pointerdown",function(e){e.preventDefault();move=v});
 b.addEventListener("pointerup",function(e){e.preventDefault();if(move===v)move=0});
 b.addEventListener("pointercancel",function(){if(move===v)move=0});
 b.addEventListener("pointerleave",function(){if(move===v)move=0});
}
bind("left",-1);bind("right",1);

function update(dt){
 var prevBottom=player.y+player.h/2;
 player.vx+=move*720*dt;if(move===0)player.vx*=Math.pow(.04,dt);
 player.vx=Math.max(-220,Math.min(220,player.vx));
 player.vy+=780*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;
 if(player.x<16){player.x=16;player.vx=70}if(player.x>W-16){player.x=W-16;player.vx=-70}
 if(player.vy>0){
   var nb=player.y+player.h/2;
   for(var i=0;i<plats.length;i++){
     var p=plats[i];
     if(prevBottom<=p.y&&nb>=p.y&&player.x+16>p.x&&player.x-16<p.x+p.w){
       player.y=p.y-player.h/2;player.vy=-455;break;
     }
   }
 }
 var ons=sy(player.y);if(ons<H*.38)camera-=H*.38-ons;
 score=Math.max(score,Math.floor((-camera)/8));scoreEl.textContent=score+" m";

 var si=stIndex();
 if(si!==currentStage){
   currentStage=si;stageEl.textContent=stages[si].n;creditEl.textContent=stages[si].credit;
   showFlash(stages[si].n);
 }
 for(var g=0;g<gems.length;g++){
   var gem=gems[g];if(gem.taken)continue;
   var dx=player.x-gem.x,dy=player.y-gem.y;
   if(dx*dx+dy*dy<720){gem.taken=true;count++;itemsEl.textContent=count;showFlash(gem.kind==="heart"?"旅の思い出 ❤️":"琥珀 +1 🧡")}
 }
 var top=Infinity;for(var j=0;j<plats.length;j++)top=Math.min(top,plats[j].y);
 while(top>camera-230){top-=72;addPlatform(top)}
 plats=plats.filter(function(p){return p.y<camera+H+100});
 gems=gems.filter(function(g){return g.y<camera+H+100});
 if(sy(player.y)>H+80)endGame();
}
function drawCover(im){
 if(!im||!im.complete||!im.naturalWidth)return false;
 var iw=im.naturalWidth,ih=im.naturalHeight,scale=Math.max(W/iw,H/ih);
 var dw=iw*scale,dh=ih*scale;
 ctx.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);return true;
}
function background(){
 var s=stages[stIndex()];
 if(!drawCover(s.img)){
   var gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#9bc9eb");gr.addColorStop(1,"#e8f4fb");ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 }
 var shade=ctx.createLinearGradient(0,0,0,H);shade.addColorStop(0,"rgba(10,28,46,.18)");shade.addColorStop(.55,"rgba(10,28,46,.28)");shade.addColorStop(1,"rgba(10,28,46,.58)");ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
}
function render(){
 background();
 for(var i=0;i<plats.length;i++){
   var p=plats[i],y=sy(p.y);if(y<-30||y>H+30)continue;
   ctx.shadowColor="#0008";ctx.shadowBlur=7;ctx.fillStyle="#f7f5e9";ctx.fillRect(p.x,y,p.w,13);ctx.shadowBlur=0;
   ctx.fillStyle="#17324d";ctx.fillRect(p.x+6,y+4,p.w-12,3);
 }
 for(var j=0;j<gems.length;j++){
   var g=gems[j];if(g.taken)continue;var gy=sy(g.y);if(gy<-30||gy>H+30)continue;
   if(g.kind==="heart"){ctx.font="20px sans-serif";ctx.textAlign="center";ctx.fillText("❤️",g.x,gy+7)}
   else{ctx.fillStyle="#f2a51c";ctx.beginPath();ctx.arc(g.x,gy,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff7";ctx.stroke()}
 }
 var py=sy(player.y);
 ctx.shadowColor="#0008";ctx.shadowBlur=6;
 ctx.fillStyle="#17324d";ctx.fillRect(player.x-14,py-2,13,26);
 ctx.fillStyle="#7b4161";ctx.fillRect(player.x+2,py+2,13,24);
 ctx.fillStyle="#ffd7be";ctx.beginPath();ctx.arc(player.x-8,py-11,7,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#f1c3a5";ctx.beginPath();ctx.arc(player.x+9,py-8,7,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
 ctx.lineWidth=4;
 ctx.strokeStyle="#fdb913";ctx.beginPath();ctx.moveTo(player.x-9,py+3);ctx.lineTo(player.x-29,py-4);ctx.stroke();
 ctx.strokeStyle="#006a44";ctx.beginPath();ctx.moveTo(player.x-9,py+8);ctx.lineTo(player.x-30,py+3);ctx.stroke();
 ctx.strokeStyle="#c1272d";ctx.beginPath();ctx.moveTo(player.x-9,py+13);ctx.lineTo(player.x-27,py+12);ctx.stroke();
}
function showFlash(t){flash.textContent=t;flash.classList.add("on");clearTimeout(showFlash.t);showFlash.t=setTimeout(function(){flash.classList.remove("on")},850)}
function loop(now){if(!running)return;var dt=(now-last)/1000;last=now;if(dt>.03)dt=.03;update(dt);render();if(running)requestAnimationFrame(loop)}
function endGame(){
 running=false;
 document.getElementById("card").innerHTML='<h1>Journey<br>Complete</h1><p>到達高度 <b>'+score+' m</b><br>集めた思い出 <b>'+count+' 個</b></p><button id="retry">もう一度</button><div class="note">背景写真: Wikimedia Commons</div>';
 overlay.style.display="grid";document.getElementById("retry").onclick=reset;
}
document.getElementById("start").onclick=reset;
stageEl.textContent=stages[0].n;creditEl.textContent=stages[0].credit;background();
})();
</script>
</body>
</html>
